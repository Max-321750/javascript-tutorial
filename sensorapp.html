<script>

    let sensorTag  = document.getElementById('sensorInput') // <input type="text" id="sensorInput">
    let container = document.getElementById('container') // <div id="container"> </div>
    

function sensorWords() {
    // stupid foolish shit damn 
    let sensoredValue = sensorTag.value.trim().toLowerCase() // 'that guy behaved stupid'
    sensoredValue = sensoredValue.replaceAll('stupid' , '******').replaceAll('foolish' , '*******').replaceAll('shit', '****').replaceAll('damn', '****') // 'that guy behaved ******'
    console.log(sensoredValue); // 'that guy behaved ******'

    container.innerHTML = sensoredValue[0].toUpperCase() + sensoredValue.substr(1) // 'That guy behaved ******'
    sensorTag.value = ''

}
