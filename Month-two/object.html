<style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #eef2f5;
    padding: 40px;
  }

  h2 {
    color: #10243e;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    max-width: 900px;
    background: #ffffff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
  }

  th, td {
    padding: 12px 16px;
    text-align: left;
    font-size: 0.9rem;
  }

  th {
    background: #10243e;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-size: 0.8rem;
  }

  td {
    border-bottom: 1px solid #e3e9ee;
    color: #10243e;
  }

  tr:nth-child(even) {
    background: #f4f9fc;
  }

  tr:hover {
    background: #dff3fb;
    transition: background 0.15s ease;
  }
</style>
</head>
