<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equinx - Sign Up</title>

<style>
* {
    box-sizing: border-box;
}

body {

    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    padding: 24px 0;
    background: linear-gradient(
        120deg,
        #ff0000,
        #ff7300,
        #ffff00,
        #00ff00,
        #00ffff,
        #008cff,
        #ff00ff,
        #ff0000
    );
    background-size: 600% 600%;
    animation: flashyBackground 12s ease infinite;
}


/* Background Animation */

@keyframes flashyBackground {

    0% {
        background-position: 0% 50%;
    }

    20% {
        background-position: 50% 100%;
    }

    40% {
        background-position: 100% 50%;
    }

    60% {
        background-position: 50% 0%;
    }

    80% {
        background-position: 0% 50%;
    }

    100% {
        background-position: 100% 100%;
    }
}


/* Wrapper */

.wrapper {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 20px;

    width: 100%;
}


/* Signup Card */

.card {

    width: 360px;

    max-width: calc(100% - 30px);

    background: rgba(255, 255, 255, 0.96);

    border-radius: 20px;

    padding: 36px;

    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.35),
        0 0 25px rgba(255, 255, 0, 0.5);

    border: 3px solid rgba(255, 255, 255, 0.8);
}


/* =========================
   EQUINX LOGO
========================= */

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  font-size: 25px;
  font-weight: 800;
  color: #ff7300;
}


.logo-mark {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  color: white;
  font-size: 21px;
  font-weight: 800;
  background: linear-gradient(
    135deg,
   #ff0000,
   #ff7300,
   #ffff00,
   #00ff00
  );

  box-shadow:
    0 5px 15px rgba(139, 0, 0, 0.25);
  transition: 0.3s;
}



.logo-text {
  letter-spacing: -0.8px;
}


.logo:hover .logo-mark {
  transform: rotate(-8deg) scale(1.05);
}
.logo:hover .logo-text {
  color:  #ff0000,;
}


/* Heading */

h2 {

    margin: 0 0 24px 0;

    color: #ff0000;

    font-size: 1.6rem;

    text-align: center;
}


/* Labels */

label {

    display: block;

    color: #222;

    font-size: 0.85rem;

    font-weight: 600;

    margin-bottom: 6px;

    margin-top: 16px;
}


/* Inputs */

input[type="text"],
input[type="email"],
input[type="password"] {

    width: 100%;

    padding: 12px 14px;

    font-size: 1rem;

    border: 2px solid #ffcc00;

    border-radius: 10px;

    color: #222;

    background: #fffef0;

    transition: all 0.3s ease;
}


/* Input Focus */

input:focus {

    outline: none;

    border-color: #00c853;

    box-shadow:
        0 0 8px #00ff00,
        0 0 15px rgba(0, 255, 0, 0.4);
}


/* Checkbox */

.checkbox-row {

    display: flex;

    align-items: flex-start;

    gap: 8px;

    margin-top: 18px;
}

.checkbox-row input {

    margin-top: 3px;

    flex-shrink: 0;

    accent-color: #ff0000;
}

.checkbox-row label {

    margin: 0;

    font-size: 0.8rem;

    line-height: 1.4;

    color: #333;
}


/* Terms Links */

.checkbox-row a {

    color: #008000;

    font-weight: bold;

    text-decoration: none;
}

.checkbox-row a:hover {

    color: #ff0000;

    text-decoration: underline;
}


/* Signup Button */

button {

    width: 100%;

    margin-top: 24px;

    padding: 14px 0;

    border: none;

    border-radius: 30px;

    color: white;

    font-size: 1rem;

    font-weight: bold;

    cursor: pointer;

    background: linear-gradient(
        90deg,
        #ff0000,
        #ff7300,
        #ffcc00,
        #00c853,
        #00aaff,
        #ff00ff
    );

    background-size: 400% 400%;

    animation: buttonAnimation 5s ease infinite;

    box-shadow:
        0 5px 15px rgba(0, 0, 0, 0.25);

    transition: transform 0.2s ease;
}


/* Button Animation */

@keyframes buttonAnimation {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}


/* Button Hover */

button:hover {

    transform: scale(1.05);

    box-shadow:
        0 0 15px #ffff00,
        0 0 30px rgba(255, 0, 0, 0.5);
}


/* Button Click */

button:active {

    transform: scale(0.97);
}


/* Login Link */

.account-link {

    margin-top: 20px;

    text-align: center;

    font-size: 0.85rem;

    color: #555;
}

.account-link a {

    color: #008cff;

    font-weight: bold;

    text-decoration: none;
}

.account-link a:hover {

    color: #ff0000;

    text-decoration: underline;
}


/* Mobile */

@media (max-width: 480px) {

    .card {

        padding: 28px 24px;
    }

    h2 {

        font-size: 1.4rem;
    }

    .brand {

        font-size: 1.8rem;
    }
}

</style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <a href="signupform.html" class="logo">
            <span class="logo-mark">E</span>
            <span class="logo-text">Equinx</span>
        </a>
        <h2>Create an Account</h2>
        <label for="nameInput"> Full Name</label>

        <input type="text" id="nameInput" placeholder="e.g Emmy James">
         <label for="emailInput"> Email </label>
        <input type="email" id="emailInput" placeholder="e.g emmy@email.com" >
        <label for="passwordInput"> Password </label>
        <input type="password" id="passwordInput" placeholder="Enter a password" >
        <label for="confirmPasswordInput"> Confirm Password </label>
        <input type="password" id="confirmPasswordInput" placeholder="Confirm password" >
        <div class="checkbox-row">
        <input type="checkbox" id="privacyCheckbox" >
            <label for="privacyCheckbox"> I agree to the <a href="#"> Terms and Conditions </a> and <a href="#"> Privacy Policy </a> </label>
        </div>
         <button type="submit" id="signupBtn" onclick="signUp(event)" > Sign Up </button>
        <p class="account-link"> Already have an account? <a href="login.html"> Log In </a> </p>
    </div>
</div>

<script>

let users = JSON.parse(localStorage.getItem('SeptUsers26')) || [];

console.log(users);

function signUp(ev) {
    ev.preventDefault();
    let nameElement = document.getElementById('nameInput');
    let emailElement = document.getElementById('emailInput');
    let passwordElement = document.getElementById('passwordInput');
    let confirmPasswordElement = document.getElementById('confirmPasswordInput');
    let privacyElement = document.getElementById('privacyCheckbox');


    let name = nameElement.value.trim();
    let email = emailElement.value.trim().toLowerCase();
    let password = passwordElement.value.trim();
    let confirmPassword = confirmPasswordElement.value.trim();
    let agreedToPrivacy = privacyElement.checked;
    let button = document.getElementById("signupBtn");



    if ( !name || !email || !password || !confirmPassword ) {
        alert('All fields are Mandatory');
    }else if (!agreedToPrivacy) {
        alert( 'You must agree to the Terms and Conditions and the Privacy Policy to sign up.' );
    }else if ( users.find(function(user) { return user.email === email; }) ) {
        alert('User already exists');
    }else if (password !== confirmPassword) {
        alert('Password must match');
    }
    if (password.length < 8) {
        alert( 'Password must be at least 8 characters' );
    }

    let user = {
        name: name,
        email: email,
        password: password,
        agreedToPrivacy: agreedToPrivacy
    };


    users.push(user);
    localStorage.setItem( 'SeptUsers26', JSON.stringify(users) )
  
    console.log(users);



    alert(
        `Sign up successful! Welcome, ${name}.`
    );

    nameElement.value = '';
    emailElement.value = '';
    passwordElement.value = '';
    confirmPasswordElement.value = '';
    privacyElement.checked = false;

    button.innerHTML = `loading......`

        setTimeout(() => {
              window.location.href = "login.html";
         }, 2000);

}

</body>
</html>
