<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quivox - Dashboard</title>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f7f7fb;
        color: #17171c;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .dashboard {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      .topbar {
        min-height: 64px;
        padding: 0 22px;
        background: white;
        border-bottom: 1px solid #e9e9ef;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 18px;
      }
      .nav-right {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .topbar-welcome {
        font-size: 14px;
      }

      .logout-button {
        border: 0;
        border-radius: 8px;
        padding: 10px 15px;
        background: #5737d6;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }

      .logout-button:hover {
        background: #4529bd;
      }

    .sidebar {
      width: 330px;
      background: white;
      border-right: 1px solid #e9e9ef;
      display: flex;
      flex-direction: column;
    }

    .sidebar-top {
      padding: 20px;
      border-bottom: 1px solid #eeeeF2;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #5737d6;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: #5737d6;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 6px 16px rgba(87, 55, 214, 0.2);
    }

    .logo-icon::before {
      content: "";
      width: 21px;
      height: 16px;
      background: white;
      border-radius: 6px;
      position: absolute;
      top: 10px;
      left: 9px;
    }

    .logo-icon::after {
      content: "";
      width: 7px;
      height: 7px;
      background: white;
      position: absolute;
      bottom: 8px;
      left: 11px;
      transform: rotate(35deg);
      border-radius: 1px;
    }

    .logo-dots {
      position: absolute;
      z-index: 2;
      display: flex;
      gap: 3px;
      top: 16px;
    }

    .logo-dots span {
      width: 4px;
      height: 4px;
      background: #5737d6;
      border-radius: 50%;
    }

    .logo-text {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .search-area {
      padding: 18px;
    }

    .search-box {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid #dedee7;
      border-radius: 9px;
      outline: none;
      font-size: 13px;
      background: #fafaff;
    }

    .search-box:focus {
      border-color: #5737d6;
    }

    .chat-title {
      padding: 0 18px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-title h3 {
      font-size: 15px;
    }

    .new-chat {
      border: none;
      background: transparent;
      color: #5737d6;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
    }

    .empty-chats {
      padding: 50px 25px;
      text-align: center;
      color: #9999a2;
    }

    .empty-chat-icon {
      width: 55px;
      height: 55px;
      margin: 0 auto 15px;
      background: #eeebff;
      color: #5737d6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
    }

    .empty-chats h4 {
      color: #55555f;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .empty-chats p {
      font-size: 12px;
      line-height: 1.5;
    }

    .profile {
      padding: 15px 18px;
      border-top: 1px solid #eeeeF2;
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .profile-avatar {
      width: 39px;
      height: 39px;
      border-radius: 50%;
      background: #5737d6;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
    }

    .profile-info {
      flex: 1;
    }

    .profile-info strong {
      display: block;
      font-size: 13px;
    }

    .profile-info span {
      font-size: 11px;
      color: #36a36d;
    }

    .profile-menu {
      font-size: 20px;
      color: #777780;
      cursor: pointer;
    }

    .chat-container {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        margin: 20px;
        overflow: hidden;
        background: white;
        border: 1px solid #e9e9ef;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(30, 20, 70, 0.06);
      }

      .chat-header {
        padding: 16px 20px;
        border-bottom: 1px solid #e9e9ef;
      }

      .chat-header h3 {
        font-size: 17px;
      }

      .chat-header p {
        margin-top: 4px;
        color: #888892;
        font-size: 13px;
      }

      .chat-messages {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 12px;
        min-height: 0;
        padding: 20px;
        overflow-y: auto;
        background: #fafaff;
      }

      .chat-form {
        display: flex;
        flex: 0 0 auto;
        gap: 10px;
        padding: 14px;
        border-top: 1px solid #e9e9ef;
        background: white;
      }

      .chat-form input {
        flex: 1;
        min-width: 0;
        padding: 12px 14px;
        border: 1px solid #dedee7;
        border-radius: 9px;
        outline: none;
        font-size: 14px;
      }

      .chat-form input:focus {
        border-color: #5737d6;
      }

      .chat-form button {
        width: auto;
        min-width: 64px;
        padding: 0 16px;
        font-size: 14px;
      }
      .send-button {
        background: #5737d6;
        color: white;
        transition: background 0.2s ease;
      }

      .send-button:hover {
        background: #4529bd;
      }
     .send-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .message {
      max-width: 70%;
      padding: 10px 14px;
      border: 1px solid #e9e9ef;
      border-radius: 12px;
      background: white;
      align-self: flex-start;
      overflow-wrap: anywhere;
    }

    .message .sender {
      margin-bottom: 4px;
      color: #5737d6;
      font-size: 13px;
      font-weight: 700;
    }

    .message .time {
      display: block;
      margin-top: 4px;
      color: #888892;
      font-size: 11px;
      text-align: right;
    }

    /* Messages sent by the signed-in user */
    .message.mine {
      align-self: flex-end;
      border-color: #5737d6;
      background: #5737d6;
      color: white;
    }

    .message.mine .sender,
    .message.mine .time {
      color: #e0e7ff;
    }

    .chatMessages {
      display: flex;
      flex-direction: column;
    }

    .message.theirs {
      align-self: flex-start;
      text-align: left;
    }

    .message.mine {
      align-self: flex-end;
      text-align: left;
    }
    .message-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .message-actions button {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 13px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .message-actions button[data-action="edit"] {
      background-color: #4caf50;
    }

    .message-actions button[data-action="edit"]:hover {
      background-color: #388e3c;
    }

    .message-actions button[data-action="delete"] {
      background-color: #e53935;
    }

    .message-actions button[data-action="delete"]:hover {
      background-color: #c62828;
    }

      @media (max-width: 750px) {
        .chat-container {
          margin: 14px;
        }
      }

      @media (max-width: 500px) {
        .chat-container {
          margin: 10px;
        }

        .chat-header {
          padding: 14px 16px;
        }

        .chat-messages {
          padding: 14px;
        }

        .chat-form {
          padding: 10px;
        }
      }

    @media (max-width: 750px) {
      .sidebar {
        width: 90px;
      }

      .logo-text,
      .search-area,
      .chat-title,
      .profile-info,
      .profile-menu,
      .empty-chats {
        display: none;
      }

      .sidebar-top {
        display: flex;
        justify-content: center;
      }

      .logo {
        justify-content: center;
      }

      .profile {
        justify-content: center;
      }
    }

    @media (max-width: 500px) {
      .sidebar {
        display: none;
      }

      .message-area {
        padding: 12px;
      }

      .attach-button {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="topbar-welcome">
      Welcome, <strong id="userName">Loading...</strong> 👋
    </span>
    <button type="button" id="logOutBtn" class="logout-button" onclick="logOutBtn()">Log Out</button>
  </div>

<div class="dashboard">
    <aside class="sidebar">
      <div class="sidebar-top">
        <a href="index.html" class="logo">
          <div class="logo-icon">
            <div class="logo-dots">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
          <span class="logo-text">Quivox</span>
        </a>
      </div>


      <div class="profile">

        <div class="profile-avatar"> U </div>
        <div class="profile-info">
          <strong id="username">loading...</strong>
          <span>Online</span>
        </div>

        <div class="profile-menu"> ⋮ </div>
      </div>
    </aside>

        <section class="chat-container">
        <div class="chat-header">
          <h3>General Group</h3>
          <p>Everyone can see messages sent here</p>
        </div>

        <div class="chat-messages" id="chatMessages">
          <!-- Messages will appear here -->
        </div>
        <form class="chat-form" id="chatForm" onsubmit="event.preventDefault(); sendMessage();"> 
          <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" required >
           <button type="button" onclick="sendMessage()" id="sendBtn" class="send-button" disabled>Send</button>
        </form>
      </section>
  </div>
</body>
</html>
<script src="../js/dashboard.js"></script>
