<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quivox - Sign Up</title>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #f8f7ff, #eeebff);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #17171c;
      padding: 20px;
    }

    .signup-container {
      width: 100%;
      max-width: 430px;
    }

    /* LOGO */

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      color: #5737d6;
      margin-bottom: 25px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      background: #5737d6;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 7px 18px rgba(87, 55, 214, 0.22);
    }

    .logo-icon::before {
      content: "";
      width: 22px;
      height: 17px;
      background: white;
      border-radius: 7px;
      position: absolute;
      top: 10px;
      left: 10px;
    }

    .logo-icon::after {
      content: "";
      width: 7px;
      height: 7px;
      background: white;
      position: absolute;
      bottom: 9px;
      left: 12px;
      transform: rotate(35deg);
      border-radius: 1px;
    }

    .logo-dots {
      position: absolute;
      z-index: 2;
      display: flex;
      gap: 3px;
      top: 17px;
    }

    .logo-dots span {
      width: 4px;
      height: 4px;
      background: #5737d6;
      border-radius: 50%;
    }

    .logo-text {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    /* SIGNUP CARD */

    .signup-card {
      background: white;
      padding: 38px;
      border-radius: 18px;
      box-shadow: 0 20px 55px rgba(30, 20, 70, 0.12);
      border: 1px solid #eeeeF2;
    }

    .signup-card h1 {
      font-size: 28px;
      margin-bottom: 8px;
      text-align: center;
    }

    .signup-card .intro {
      text-align: center;
      color: #777780;
      font-size: 14px;
      margin-bottom: 28px;
    }

    /* FORM */

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .form-group input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #dcdce4;
      border-radius: 9px;
      outline: none;
      font-size: 14px;
      transition: 0.3s;
    }

    .form-group input:focus {
      border-color: #5737d6;
      box-shadow: 0 0 0 3px rgba(87, 55, 214, 0.1);
    }

    /* TERMS */

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 8px 0 22px;
      font-size: 13px;
      color: #666672;
    }

    .terms input {
      margin-top: 3px;
      accent-color: #5737d6;
    }

    .terms a {
      color: #5737d6;
    }

    /* BUTTON */

    .signup-submit {
      width: 100%;
      border: none;
      background: #5737d6;
      color: white;
      padding: 14px;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
    }

    .signup-submit:hover {
      background: #4528b8;
      transform: translateY(-1px);
    }

    /* LOGIN LINK */

    .login-link {
      text-align: center;
      margin-top: 22px;
      color: #777780;
      font-size: 14px;
    }

    .login-link a {
      color: #5737d6;
      font-weight: 600;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }
    .divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 20px 0;
  color: #777780;
  font-size: 13px;
}

.divider::before,
.divider::after {
  content: "";
  flex: 1;
  border-top: 1px solid #dcdce4;
}

.btn-google {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 12px 14px;
  border: 1px solid #dcdce4;
  border-radius: 9px;
  background: white;
  color: #33333a;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
}

.btn-google:hover {
  background: #f8f8fb;
  border-color: #bdbdc8;
}

.btn-google:focus-visible {
  outline: 3px solid rgba(87, 55, 214, 0.2);
  outline-offset: 2px;
}

.btn-google svg {
  flex-shrink: 0;
}

    /* MOBILE */

    @media (max-width: 500px) {

      .signup-card {
        padding: 28px 22px;
      }

      .signup-card h1 {
        font-size: 25px;
      }
    }
    @media (max-width: 360px) {
      .login-card {
        padding: 24px 16px;
      }

      .login-options {
        font-size: 12px;
      }
    }

  </style>

</head>
<body>

  <div class="signup-container">

    <!-- LOGO -->

    <a href="index.html" class="logo">
      <div class="logo-icon">
        <div class="logo-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>

      </div>

      <span class="logo-text"> Quivox </span>
    </a>

    <!-- SIGNUP CARD -->

    <div class="signup-card">
      <h1> Create your account </h1>
      <p class="intro">
        Join Quivox and start connecting with people.
      </p>
      <form>

        <!-- NAME -->

        <div class="form-group">
          <label for="name">
            Full name
          </label>
          <input type="text" id="fullname" placeholder="Enter your full name" required >
        </div>

        <!-- EMAIL -->

        <div class="form-group">
          <label for="email">
            Email address
          </label>
             <input type="email" id="email" placeholder="Enter your email" required >
        </div>

        <!-- PASSWORD -->

        <div class="form-group">
          <label for="password">
            Password
          </label>
          <input type="password" id="password" placeholder="Create a password" required >
        </div>

        <!-- CONFIRM PASSWORD -->

        <div class="form-group">
          <label for="confirmPassword">
            Confirm password
          </label>

          <input type="password" id="confirmPassword" placeholder="Confirm your password" required >
        </div>

        <!-- TERMS -->

        <div class="terms">

          <input type="checkbox" id="terms" required >

          <label for="terms">
            I agree to the
            <a href="#">Terms of Service</a>
            and
            <a href="#">Privacy Policy</a>.
          </label>
        </div>

        <!-- SIGN UP -->

        <button type="button" id="signUpBtn" class="signup-submit" onclick="signUserUp()" > Create Account </button>
      </form>

       <div class="divider"><span>or</span></div>

      <button type="button" onclick="signInWithGoogle()"  id="googleBtn" class="btn btn-google btn-block">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </button>

      <!-- LOGIN -->

      <p class="login-link">
        Already have an account?
        <a href="login.html"> Log in </a>
      </p>
    </div>
  </div>

</body>
</html>
<script src="../js/signup.js"></script>
