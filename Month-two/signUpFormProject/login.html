<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equinx - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">

            <a href="login.html" class="logo">
                <span class="logo-mark">E</span>
                <span class="logo-text">Equinx</span>
            </a>

            <h1>Welcome back</h1>
            <p class="subtitle">
                Continue sharing your ideas with the world.
            </p>

            <form onsubmit="logUserIn(event)">

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required >
                 </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required >
                </div>

                <button id= "loginButton" type="submit" class="main-btn"> Log In </button>
            </form>
             
            <p class="bottom-text"> New to Equinx? <a href="signupform.html">Create an account</a> </p>
            
        </div>
    </div>

    <script>

        let allUsers = JSON.parse(localStorage.getItem('SeptUsers26')) || []

        
        function logUserIn(event) {
        event.preventDefault()

        let email = document.getElementById('email').value.trim()
        let password = document.getElementById('password').value.trim()
        let button = document.getElementById("loginButton");



        let foundUser = allUsers.find((user)=> { return user.email === email })
        let foundUserIndex = allUsers.findIndex((user)=> { return user.email === email })
        if (!email || !password) {
            alert('all fields are mandatory')
        } else {

            if (!foundUser) {
            alert('user doesnt exist')
            } else if ( foundUser.password !== password) {
            alert('invalid credentials')
            } else {
            alert('log in successful')
            localStorage.setItem('currentUserIndex' , JSON.stringify(foundUserIndex))

          
                 button.innerHTML = `logging you in......`

                setTimeout(() => {
                      window.location.href = "dashboard.html";
                }, 2000);
                }
            }
        }
    </script>

</body>
</html>
