<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Photo Change</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eef2f5;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  .carousel {
    width: 320px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    overflow: hidden;
    text-align: center;
  }

  .carousel img {
    width: 100%;
    height: 280px;
    object-fit: cover;
    background: #dff3fb;
    display: block;
  }

  .carousel .info {
    padding: 20px;
  }

  .carousel .name {
    font-size: 1.2rem;
    font-weight: bold;
    color: #10243e;
  }
</style>
</head>
<body>

<div class="carousel">
  <img id="carouselPhoto" src="" alt="photo">
  <div class="info">
    <div class="name" id="carouselName"></div>
  </div>
</div>

<script>

    let people = [
        { name: `Emmanuel`, photo: `https://api.dicebear.com/7.x/avataaars/svg?seed=Emmanuel` },
        { name: `Chika`,    photo: `https://api.dicebear.com/7.x/avataaars/svg?seed=Chika` },
        { name: `Janet`,  photo: `https://api.dicebear.com/7.x/avataaars/svg?seed=Ibrahim` },
        { name: `Mariam`,   photo: `https://api.dicebear.com/7.x/avataaars/svg?seed=Mariam` },
        { name: `Tumise`,  photo: `https://api.dicebear.com/7.x/avataaars/svg?seed=Solomon` }
    ]

    let currentIndex = 0

    function genPhoto() {
        let person = people[currentIndex]

        currentIndex = currentIndex + 1

        if(currentIndex >= people.length){
            currentIndex = 0
        }

        document.getElementById(`carouselName`).textContent = person.name

        return person.photo
    }

    console.log(genPhoto())

    setInterval(()=> {
        document.getElementById(`carouselPhoto`).src = genPhoto()
    }, 2000)

</script>
</body>
</html>
