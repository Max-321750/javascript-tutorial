<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · Equinx</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
<div class="navbar-inner">
<a href="dashboard.html" class="logo">
  <span class="logo-mark">E</span>
  <span class="logo-text">Equinx</span>
</a>

  <div class="nav-right">
    <span id="navUserEmail">
      Loading...
    </span>
    <button onclick="logOut()" class="btn btn-ghost btn-small" > Log out </button>
  </div>
</div>
  </header>
  <main class="container">
<section class="welcome">

  <h1>
    Hello,
    <span id="userName">Loading...</span>
  </h1>
  <p> What's on your mind today? </p>
</section>
<section class="panel">
<h2> Write a new post </h2>

  <form id="postForm">
    <div class="field"> <label for="postTitle"> Title </label>
      <input type="text" id="postTitle" placeholder="Give it a title" >
    </div>
    <div class="field">
      <label for="postBody"> Content </label>
      <textarea id="postBody" placeholder="Start writing..." ></textarea>
    </div>
<div class="field">
    <label for="postImage">Add a picture</label>
    <input type="file" id="postImage" accept="image/*" onchange="pickPicture(event)" >
    <img width="200" height="200" id="myImage" src="" alt="" style="display: none;" >
</div>
    <button type="submit" class="btn" > Publish </button>
  </form>
</section>
<section>
  <div class="section-head">
    <h2> Your Posts </h2>
    <span id="postCount"> 0 post </span>
  </div>
  <div id="emptyState" class="empty-state" > You haven't written anything yet. Your posts will show up here. </div>
  <div id="postList"></div>
</section>
  </main>
  <script>

    let allUsers = JSON.parse( localStorage.getItem("SeptUsers26") ) || [];
    let currentUserIndex = JSON.parse( localStorage.getItem("currentUserIndex") );

    let currentUser = allUsers[currentUserIndex];

    let selectedImage = "";

    function pickPicture(ev) {
        let inputTag = ev.target;
        let file = inputTag.files[0];


        if (!file) {
            alert("Please attach a file");
            return;
        }

        if (file.size / 1000 >= 2000) {
            alert("File is too large, must be less than 150KB");
            return;
        }

        let reader = new FileReader();

        reader.readAsDataURL(file);

        reader.addEventListener("load", function(e) {
            let image = e.target.result;
            selectedImage = image;
            myImage.src = image;
            myImage.style.display = "block";
        });
    }



    function authenticateUser() {

      if (!currentUser) {
        window.location.href = "login.html";
        return;
      }

      document.getElementById("userName").textContent = currentUser.name;
      document.getElementById("navUserEmail").textContent = currentUser.email;
      displayPosts();
    }

    authenticateUser();

    function getUserPosts() {

      let allPosts = JSON.parse( localStorage.getItem("EquinxPosts") ) || [];

      return allPosts.filter(function(post) {
        return post.userEmail === currentUser.email;
      });

    }

        document .getElementById("postForm") .addEventListener("submit", function(event) {

        event.preventDefault();

        let title = document .getElementById("postTitle") .value .trim()
        let body = document .getElementById("postBody") .value .trim()
        
        if (!title) {
          alert("Please enter a title.")
          return
        }else if(!body) {
          alert("Please enter some content.")
          return
        }

        let allPosts = JSON.parse( localStorage.getItem("EquinxPosts") ) || []

        let titleAlreadyUsed = allPosts.some(function(post) {
            return ( post.userEmail === currentUser.email && post.title.toLowerCase() === title.toLowerCase() )
          });



        if (titleAlreadyUsed) {
          alert(
            "This title has already been used. Please choose a different title."
          );
          return;
        }


        let newPost = {
          userEmail: currentUser.email,
          title: title,
          body: body,
          image: selectedImage,
          date: new Date().toLocaleDateString()
        };

        allPosts.push(newPost);

        localStorage.setItem( "EquinxPosts", JSON.stringify(allPosts) );

        document .getElementById("postForm") .reset();

        selectedImage = "";

        document.getElementById("myImage").style.display = "none";

        displayPosts()

        alert("Post published successfully!");

      });

    function displayPosts() {

      let posts = getUserPosts();
      let postCount = document.getElementById("postCount");
      let emptyState = document.getElementById("emptyState");
      let postList = document.getElementById("postList");
  
      if (posts.length === 1) {
          postCount.textContent = "1 post";
      } else {
          postCount.textContent = posts.length + " posts";
      }

      postList.innerHTML = "";

      if (posts.length === 0) {
        emptyState.style.display = "block";
        return;
      }

      emptyState.style.display = "none"

      
      posts.forEach(function(post) {

        let postDiv = document.createElement("div")
        postDiv.className = "post";
        postDiv.innerHTML = ` <h3>${post.title}</h3> 
        <p>${post.body}</p> 

        ${ 
        post.image ? 
        `<img src="${post.image}" 
        class="post-image">` : "" }

        <small> ${post.date} </small>
       

        <div class="post-actions"> 
             <button class="edit-btn">Edit</button> 
             <button class="delete-btn">Delete</button>
       </div> `;

        postList.appendChild(postDiv)
      });

    }


    function logOut() {
        let confirmLogout = confirm( "Are you sure you want to log out?" )

      if (confirmLogout) {
        localStorage.removeItem( "currentUserIndex" )
        window.location.href = "login.html";
      }

    }


  </script>
</body>
</html>
