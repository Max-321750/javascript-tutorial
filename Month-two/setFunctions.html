function displayImage() {
    let buttonTag = document.getElementById('myButton')
    setLoadingState(buttonTag , true)
   setTimeout(() => {
     myImg.src = 'https://i.ebayimg.com/images/g/RVcAAOSwfr1jk~3U/s-l1600.webp'
    myImg.style.display = 'block'
    alert('Image uploaded successfully')
    setLoadingState(buttonTag , false)
   }, 3000);
}



function setLoadingState( element ,  bool ) {
  element.innerHTML =   bool ?  'loading...' : 'Show Image'
  element.disabled = bool
}

function countDown() {
    let number = +num.innerHTML
    console.log(number);

  let decreaseVal = setInterval(() => {
         number--
         if (number === 0) {
          clearInterval(decreaseVal)
          alert('Time Up!')
         }

       num.innerHTML = number  
    }, 1000);
      
}

}
