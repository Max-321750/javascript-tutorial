<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Filter</title>
<style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #eef2f5;
    padding: 40px;
    display: flex;
    justify-content: center;
  }

  .container {
    width: 400px;
  }

  h2 {
    color: #10243e;
  }

  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 1rem;
    border: 2px solid #cfe3f0;
    border-radius: 8px;
    margin-bottom: 20px;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: #10243e;
  }

  .results {
    background: #ffffff;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    overflow: hidden;
  }

  .item {
    padding: 12px 16px;
    border-bottom: 1px solid #e3e9ee;
    color: #10243e;
  }

  .item:last-child {
    border-bottom: none;
  }

  .no-results {
    padding: 12px 16px;
    color: #8a97a5;
  }
</style>
</head>
<body>

<div class="container">
  <h2>Search Students</h2>

  <input type="text" id="searchInput" placeholder="Type a name to filter...">

  <div class="results" id="resultsList"></div>
</div>

<script>

let students = [
    `Emmanuel`,
    `Chika`,
    `Ibrahim`,
    `Mariam`,
    `Solomon`
]

function renderList(list){
    let resultsElement = document.getElementById(`resultsList`)

    if(list.length === 0){
        resultsElement.innerHTML = `<div class="no-results">No matches found.</div>`
        return
    }

    let itemsHTML = list.map(function(name){
        return `<div class="item">${name}</div>`
    })

    resultsElement.innerHTML = itemsHTML.join(``)
}

let filterStudents = () => {
    let searchValue = document.getElementById(`searchInput`).value.toLowerCase().replaceAll(` `,``)

    let filtered = students.filter(name => name.toLowerCase().includes(searchValue))

    renderList(filtered)
}

let searchInputElement = document.getElementById(`searchInput`)

searchInputElement.addEventListener(`keyup`, filterStudents)

renderList(students)
