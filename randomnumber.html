<!DOCTYPE html>

<title>Random Number Generator</title>

<body>

    <input type="text" id="minField">
    <input type="text" id="maxField">
    <button onclick="random()">Submit</button>

</body>
</html>
<script>

    let myMinField = document.getElementById(`minField`)
    let myMaxField = document.getElementById(`maxField`)

function random() {

    let minValue = +minField.value
    let maxValue = +maxField.value

    let randomNumber = Math.floor(Math.random() * (maxValue - minValue)) + minValue

    console.log(randomNumber)
}

console.log(2 < 3) // true
console.log(2 < 3) // true
